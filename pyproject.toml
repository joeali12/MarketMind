[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketmind"
version = "0.1.0"
description = "Customer Lifetime Value and Segmentation Engine (academic MVP)"
readme = "README.md"
requires-python = ">=3.11"
# Keep ranges compatible with requirements.txt pins (source of truth for installs).
dependencies = [
  "pandas>=3.0,<4",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "streamlit>=1.40,<2",
  "joblib>=1.4,<2",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "pyarrow>=16,<27",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "google-genai>=1.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "jupyter>=1.0,<2",
  "ucimlrepo>=0.0.7,<1",
  "playwright>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
